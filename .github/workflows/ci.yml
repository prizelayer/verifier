name: verifier-ci

# Hermetic. No secrets, no AWS, no network access to PrizeLayer — the library is judged entirely
# against the committed fixture, which is the point: if this build needed our servers, the thing
# it is trying to prove would already be false.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verifier-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Type-check + Node conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (locked, dev only — there are no runtime dependencies)
        run: npm ci

      - name: Assert the published artifact really has no dependencies
        # The zero-dependency claim is load-bearing and easy to erode by accident, so it is a
        # build step rather than a line in the README.
        run: |
          deps=$(node -p "Object.keys(require('./package.json').dependencies ?? {}).length")
          if [ "$deps" != "0" ]; then echo "runtime dependencies appeared: $deps"; exit 1; fi

      - name: Build
        run: npm run build

      - name: Assert the built artifact is a single self-contained file
        # "One file a skeptic can read" is a property of the OUTPUT, not of the source layout.
        # Splitting src/ later would still build, but would quietly break the claim — so the
        # absence of any module import in dist/ is checked rather than assumed.
        run: |
          test "$(ls dist/*.js | wc -l)" -eq 1 || { echo "dist must contain exactly one .js"; exit 1; }
          if grep -nE "\bfrom\s+['\"]|\brequire\s*\(" dist/verifier.js; then
            echo "dist/verifier.js imports something — it must be self-contained"; exit 1
          fi

      - name: Conformance + offline guarantee
        run: npm test

  mutation-sentinel:
    name: A broken verifier must fail the conformance suite
    # KAN-29 S4. The suite above proves this library agrees with the fixture. It does NOT prove the
    # agreement is load-bearing — a suite that had quietly stopped asserting anything would look
    # exactly as green. So each patch in test/mutations/ breaks the implementation in a way a
    # specific golden vector exists to catch, and the build fails if the suite still passes.
    #
    # Kept out of `npm test` deliberately: a developer running the suite locally should never see
    # a red they did not cause. The equivalent proof on the Kotlin side is performed by hand and
    # recorded in ADR-KAN-38, because mutating source inside a certified gate is a worse trade.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Every mutation must redden the build
        run: |
          shopt -s nullglob
          patches=(test/mutations/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no mutation patches found — the sentinel would pass vacuously"; exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "::group::$patch"
            git apply "$patch" || { echo "::error::$patch no longer applies — rebase it onto src/verifier.ts"; exit 1; }

            # The build must SUCCEED and the suite must FAIL. Asserting only that `npm test` exits
            # non-zero would accept a patch that merely breaks the type-check: tsc fails, npm test
            # exits non-zero, and this job reports "caught" for a mutation the conformance suite
            # never even ran against. That is the false confidence the whole job exists to remove.
            if ! npm run build || ! npm run build:test; then
              echo "::error::$patch breaks the type-check rather than the algorithm. A mutation must"
              echo "::error::compile, or it proves nothing about what the vectors catch."
              exit 1
            fi
            if node --test build/test/*.test.js; then
              echo "::error::$patch did NOT redden the build. The conformance suite is not catching"
              echo "::error::the defect this patch introduces — a golden vector is missing or unasserted."
              exit 1
            fi

            git apply -R "$patch"
            echo "caught: $patch"
            echo "::endgroup::"
          done
          # Nothing may survive the loop: a patch left applied would silently poison a later run.
          git diff --exit-code src/

  browsers:
    name: Browser conformance (chromium, firefox, webkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Reproduce every vector in three independent Web Crypto stacks
        run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  site:
    name: Verification page (site/)
    # The page a player opens. Its own package, so the library above keeps zero dependencies. Every
    # step reads the page as built, and the offline test opens it from a file with the network
    # refused, in the same three engines as the library.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint -- --deny-warnings

      - name: Type-check
        run: npm run typecheck

      - name: Unit, tamper, accessibility and no-storage tests
        run: npm test

      - name: Build (one classic script, relative paths)
        run: npm run build

      - name: No browser storage in the built bundle
        run: SCAN_DIST=1 npx vitest run scripts/no-browser-storage.test.ts

      - name: Bundle check
        run: npm run check-bundle

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Open the built page from file:// with the network refused, in three engines
        run: npm run test:offline

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-playwright-report
          path: site/playwright-report/
          if-no-files-found: ignore

  site-mutation-sentinel:
    name: A broken page must fail the page's tests
    # The library's sentinel above reads src/ only, so it cannot see the page. This one breaks the
    # page in ways a reader would be misled by (a FAIL shown as PASS, a mismatch drawn as a match,
    # the "what this does not prove" paragraph gone), and the build fails if the page's tests still
    # pass. Same rules: the mutant must type-check, and nothing may stay applied. A run that does not
    # end is an error naming its patch, never a catch: a test run that hangs proves nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - name: Every page mutation must redden the page's tests
        run: |
          shopt -s nullglob
          patches=(site/test/mutations/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no page mutation patches found — the sentinel would pass vacuously"; exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "::group::$patch"
            git apply "$patch" || { echo "::error::$patch no longer applies — rebase it onto site/src"; exit 1; }
            set +e
            (cd site && timeout 300 npx tsc -b)
            status=$?
            set -e
            if [ $status -eq 124 ]; then
              echo "::error::$patch: the type-check did not finish within 300 s."
              exit 1
            fi
            if [ $status -ne 0 ]; then
              echo "::error::$patch breaks the type-check rather than the page. A mutation must"
              echo "::error::compile, or it proves nothing about what the tests catch."
              exit 1
            fi
            started=$(date +%s)
            set +e
            (cd site && timeout 300 npx vitest run)
            status=$?
            set -e
            seconds=$(( $(date +%s) - started ))
            if [ $status -eq 124 ]; then
              echo "::error::$patch: the page's tests did not finish within 300 s. A hang is not a catch."
              exit 1
            fi
            if [ $status -eq 0 ]; then
              echo "::error::$patch did NOT redden the page's tests. A reader would be misled and"
              echo "::error::the suite would not notice."
              exit 1
            fi
            git apply -R "$patch"
            echo "caught: $patch (${seconds} s)"
            echo "::endgroup::"
          done
          git diff --exit-code site/src/
